name: Release - manual

on:
  workflow_dispatch:
    inputs:
      youtube_version:
        description: 'YouTube version (leave empty to skip)'
        required: false
        default: '21.41.529'
      music_version:
        description: 'YouTube Music version (leave empty to skip)'
        required: false
        default: '9.41.52'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_VERSION: ${{ inputs.youtube_version }}
          YTM_VERSION: ${{ inputs.music_version }}
        run: |
          mkdir -p bins
          args=()
          if [ -n "$YT_VERSION" ]; then args+=(--youtube "$YT_VERSION"); fi
          if [ -n "$YTM_VERSION" ]; then args+=(--music "$YTM_VERSION"); fi
          uv run main.py --m 1 "${args[@]}"
